[project]
name = "vivia"
version = "0.1.0"
description = "Local LLM stack: Ollama + Open WebUI + FastMCP + Phoenix"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1",
    "oracledb>=3.0",
    "pydantic>=2.14",
    "sqlfluff>=4.5.0",
    "sqlglot>=30.29.0",
    "tzdata>=2025.1",
]

[project.scripts]
vivia-mcp = "vivia.mcp:main"
vivia-configure = "vivia.configure:main"
vivia-lineage = "lineage:main"

[dependency-groups]
ops = ["httpx>=0.28"]
dev = [
    "arize-phoenix-otel>=0.9",
    "openinference-semantic-conventions>=0.1",
    "pytest>=8",
    "ruff>=0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vivia", "src/lineage"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

# Le filtre vit dans openwebui/functions/, hors du package src/ : les tests
# l'importent par son chemin, depuis la racine du depot.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
